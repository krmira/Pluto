[package]
name = "pluto-desktop"
version = "0.1.0"
description = "Pluto video editor desktop application"
authors = ["Pluto contributors"]
edition = "2021"
build = "build.rs"

[lib]
name = "pluto_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pluto-timeline-core = { path = "../../timeline-core" }
pluto-media-engine = { path = "../../media-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
