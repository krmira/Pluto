name: Pluto native C frontend

on:
  push:
    paths:
      - "Backdoor/**"
      - "Frontdoor/**"
      - "New Frontdoor/**"
      - ".github/workflows/rust-tauri.yml"
  pull_request:
    paths:
      - "Backdoor/**"
      - "Frontdoor/**"
      - "New Frontdoor/**"
      - ".github/workflows/rust-tauri.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-windows:
    name: Build and package portable native Windows app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Backdoor -> target
      - name: Check timeline core
        run: cargo check -p pluto-timeline-core
        working-directory: Backdoor
      - name: Build backend FFI for Windows
        run: cargo build --release -p pluto-frontdoor-ffi --target x86_64-pc-windows-gnu
        working-directory: Backdoor
      - name: Download Raylib MinGW binaries
        run: |
          curl -L -o /tmp/raylib.tar.gz https://github.com/raysan5/raylib/releases/download/5.5/raylib-5.5_minimal_w64-mingw.tar.gz
          mkdir -p /tmp/raylib
          tar -xzf /tmp/raylib.tar.gz -C /tmp/raylib --strip-components=1
      - name: Build native C frontend
        shell: bash
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Wno-unused-parameter \
            -I"/tmp/raylib/include" -I"New Frontdoor" \
            "New Frontdoor/pluto_interface.c" "New Frontdoor/pluto_bridge.c" "New Frontdoor/pluto_platform.c" \
            -L"/tmp/raylib/lib" -lraylib -lopengl32 -lgdi32 -lwinmm -lcomdlg32 \
            -o "pluto.exe"
      - name: Package portable application
        shell: bash
        run: |
          mkdir -p dist/Pluto
          cp pluto.exe dist/Pluto/Pluto.exe
          cp Backdoor/target/x86_64-pc-windows-gnu/release/pluto_frontdoor_ffi.dll dist/Pluto/
          cat > dist/Pluto/README.txt <<'EOF'
          Pluto native Windows preview

          Run Pluto.exe. Keep pluto_frontdoor_ffi.dll beside it.
          FFmpeg and ffprobe must be installed and available on PATH for media
          import, preview generation, and export.
          EOF
          cd dist
          zip -r Pluto-Native-Windows.zip Pluto
      - uses: actions/upload-artifact@v4
        with:
          name: Pluto-Portable-Windows
          if-no-files-found: error
          path: dist/Pluto-Native-Windows.zip
