name: Pluto native C frontend

on:
  push:
    paths:
      - "Backdoor/**"
      - "Frontdoor/**"
      - "New Frontdoor/**"
      - ".github/workflows/rust-tauri.yml"
  pull_request:
    paths:
      - "Backdoor/**"
      - "Frontdoor/**"
      - "New Frontdoor/**"
      - ".github/workflows/rust-tauri.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-windows:
    name: Build and package portable native Windows app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached Windows FFmpeg tools
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: /tmp/pluto-ffmpeg
          key: ffmpeg-windows-x64-essentials-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Backdoor -> target
      - name: Check timeline core
        run: cargo check -p pluto-timeline-core
        working-directory: Backdoor
      - name: Build backend FFI for Windows
        run: cargo build --release -p pluto-frontdoor-ffi --target x86_64-pc-windows-gnu
        working-directory: Backdoor
      - name: Download Raylib MinGW binaries
        run: |
          curl -L --fail --show-error -o /tmp/raylib.zip https://github.com/raysan5/raylib/releases/download/5.5/raylib-5.5_win64_mingw-w64.zip
          mkdir -p /tmp/raylib-unpack
          unzip -q /tmp/raylib.zip -d /tmp/raylib-unpack
          raylib_header="$(find /tmp/raylib-unpack -type f -name raylib.h -print -quit)"
          test -n "$raylib_header"
          raylib_root="$(dirname "$(dirname "$raylib_header")")"
          cp -R "$raylib_root" /tmp/raylib
          test -f /tmp/raylib/include/raylib.h
          test -f /tmp/raylib/lib/libraylib.a
      - name: Download and cache FFmpeg when needed
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/pluto-ffmpeg /tmp/ffmpeg-extract
          curl -L --fail -o /tmp/ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          unzip -q /tmp/ffmpeg.zip -d /tmp/ffmpeg-extract
          find /tmp/ffmpeg-extract -type f \( -name ffmpeg.exe -o -name ffprobe.exe \) -exec cp {} /tmp/pluto-ffmpeg/ \;
          test -f /tmp/pluto-ffmpeg/ffmpeg.exe
          test -f /tmp/pluto-ffmpeg/ffprobe.exe
      - name: Build native C frontend
        shell: bash
        run: |
          x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Wno-unused-parameter \
            -I"/tmp/raylib/include" -I"New Frontdoor" \
            "New Frontdoor/pluto_interface.c" "New Frontdoor/pluto_bridge.c" "New Frontdoor/pluto_platform.c" \
            -L"/tmp/raylib/lib" -lraylib -lopengl32 -lgdi32 -lwinmm -lcomdlg32 \
            -o "pluto.exe"
      - name: Package portable application
        shell: bash
        run: |
          mkdir -p dist/Pluto
          cp pluto.exe dist/Pluto/Pluto.exe
          cp Backdoor/target/x86_64-pc-windows-gnu/release/pluto_frontdoor_ffi.dll dist/Pluto/
          mkdir -p dist/Pluto/ffmpeg
          cp /tmp/pluto-ffmpeg/ffmpeg.exe /tmp/pluto-ffmpeg/ffprobe.exe dist/Pluto/ffmpeg/
          cat > dist/Pluto/README.txt <<'EOF'
          Pluto native Windows preview

          Run Pluto.exe. Keep pluto_frontdoor_ffi.dll beside it.
          FFmpeg and ffprobe are included in the ffmpeg folder.
          EOF
          cd dist
          zip -r Pluto-Native-Windows.zip Pluto
      - uses: actions/upload-artifact@v4
        with:
          name: Pluto-Portable-Windows
          if-no-files-found: error
          path: dist/Pluto-Native-Windows.zip
